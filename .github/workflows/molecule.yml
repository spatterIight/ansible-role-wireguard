---
name: molecule

on: [push, pull_request]  # yamllint disable-line rule:truthy

jobs:
  molecule:
    name: Run Molecule scenario '${{ matrix.scenario }}' on ${{ matrix.distro }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        scenario:
          - basic
          - multi_tunnel
        distro:
          - ubuntu2604
          - debian13
      fail-fast: false

    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          path: wireguard

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: wireguard/.python-version
          cache: pip
          cache-dependency-path: wireguard/molecule/requirements.txt

      - name: Install Python dependencies
        working-directory: wireguard
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v5.0.5
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('wireguard/molecule/basic/requirements.yml') }}

      - name: Install Ansible collections
        working-directory: wireguard
        run: ansible-galaxy collection install -r molecule/basic/requirements.yml

      - name: Run Molecule
        working-directory: wireguard
        run: molecule test --scenario-name ${{ matrix.scenario }}
